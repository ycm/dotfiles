# Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = .3
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffff, 3)
    font_size = 96
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(ffffff, 0.3)
    font_size = 18
    font_family = monospace
    position = 0, 0
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(ffffff, 0.3)
    inner_color = rgba(000000, 0.4)
    font_color = rgba(ffffff, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##aaaaaa99">Password...</span>
    rounding = 12

    position = 0, -80
    halign = center
    valign = center
}
